# Broker MQTT do VigIA para a demonstração local (docker compose / docker run).
#
# ATENÇÃO: acesso anônimo serve só para a demonstração em rede local.
# Em produção: um usuário e senha por estação (password_file), ACL limitando cada estação
# ao próprio tópico (acl_file) e TLS na porta 8883 (cafile/certfile/keyfile).

listener 1883
allow_anonymous true

# Nada em disco: as leituras ficam guardadas no data lake, não no broker.
persistence false

# Log no stdout para aparecer em `docker logs`.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Uma leitura tem ~170 bytes; recusar mensagens grandes protege o gateway de abuso.
max_packet_size 4096
