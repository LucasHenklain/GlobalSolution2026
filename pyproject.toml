[project]
name = "vigia"
version = "1.0.0"
description = "VigIA - alerta comunitario de enchentes (Global Solution 2026/2 - CitizenTech - Grupo 14)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dados/lake", "var", "referencias"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert e normal em testes

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # senhas de teste fixas
"dados/dashboard/app.py" = ["E501"]  # configuracao de graficos e tabelas fica mais legivel em uma linha
"devops/ci_local.py" = ["S603", "S607", "E501"]  # executa comandos fixos (ruff, pytest, docker), sem entrada externa
"devops/preparar.py" = ["S603"]
"devops/demo.py" = ["S603", "E501"]  # inicia os servicos locais com comandos fixos
"docs/*" = ["S603", "S607", "E501"]  # ferramentas de captura e geracao do PDF: comandos fixos, textos longos
"ia/mensagens.py" = ["E501"]  # textos dos alertas: uma frase por linha

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", "dados/lake", "var", "referencias"]
