[project]
name = "vigia"
version = "1.0.0"
description = "VigIA - alerta comunitario de enchentes (Global Solution 2026/2 - CitizenTech - Grupo 14)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dados/lake", "var", "referencias"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert e normal em testes

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # senhas de teste fixas

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", "dados/lake", "var", "referencias"]
